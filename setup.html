<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchEstate | Setup Guide</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    color:#1b2b44;
}

header{
    background:#0b2f63;
    color:white;
    padding:35px;
    text-align:center;
}

header h1{
    font-size:36px;
}

header p{
    margin-top:10px;
    color:#d9e8ff;
}

.container{
    max-width:900px;
    margin:50px auto;
    background:white;
    padding:40px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h2{
    margin-bottom:20px;
    color:#0b2f63;
}

.step{
    margin-bottom:28px;
    padding:20px;
    border-left:5px solid #13b5c8;
    background:#f8fbff;
}

.step h3{
    margin-bottom:8px;
}

footer{
    text-align:center;
    padding:40px;
    color:#666;
    font-size:14px;
}
</style>

</head>

<body>

<header>

<h1>MatchEstate</h1>

<p>Setup Guide</p>

</header>

<div class="container">

<h2>Getting Started</h2>

<div class="step">
<h3>Step 1</h3>
<p>Open Google Sheets.</p>
</div>

<div class="step">
<h3>Step 2</h3>
<p>Go to <strong>Extensions → MatchEstate</strong>.</p>
</div>

<div class="step">
<h3>Step 3</h3>
<p>Click <strong>First Setup</strong>.</p>
</div>

<div class="step">
<h3>Step 4</h3>
<p>Enter your Gemini API Key.</p>
</div>

<div class="step">
<h3>Step 5</h3>
<p>Click <strong>Save</strong>.</p>
</div>

<div class="step">
<h3>Step 6</h3>
<p>Start AI Property Matching.</p>
</div>

</div>

<footer>

© 2026 MatchEstate. All rights reserved.

</footer>

</body>
</html>
